<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1580" width="1000" height="1580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1580" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="100" y="46" font-size="27" font-weight="700" fill="#0F172A">Shaping: raw idea → shaped pitch</text>
  <text x="100" y="74" font-size="14.5" fill="#64748B">Companion map to the Shaping Travel Guide. Numbers match the guide's stages.</text>

  <!-- ================= STAGE 0 ================= -->
  <rect x="100" y="96" width="400" height="104" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="122" r="17" fill="#B45309"/>
  <text x="100" y="128" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="126" y="128" font-size="17" font-weight="700" fill="#0F172A">Capture the raw idea</text>
  <text x="126" y="152" font-size="13" fill="#475569">• Trigger: support, sales, a gap, our own itch</text>
  <text x="126" y="172" font-size="13" fill="#475569">• Two lines, in their words. No promise.</text>
  <text x="126" y="192" font-size="12.5" font-style="italic" fill="#B45309">→ a one-liner + what they were trying to do</text>

  <line x1="300" y1="200" x2="300" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <polygon points="300,232 450,274 300,316 150,274" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="300" y="269" font-size="13.5" font-weight="600" fill="#7C2D12" text-anchor="middle">Worth spending shaping</text>
  <text x="300" y="288" font-size="13.5" font-weight="600" fill="#7C2D12" text-anchor="middle">time on it now?</text>

  <line x1="450" y1="274" x2="552" y2="274" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="470" y="264" font-size="12" font-weight="700" fill="#64748B">no</text>
  <rect x="560" y="242" width="380" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="580" y="269" font-size="13.5" font-weight="600" fill="#334155">Park it. No promise, no backlog.</text>
  <text x="580" y="290" font-size="13" fill="#64748B">If it matters, it comes back on its own.</text>

  <text x="312" y="338" font-size="12" font-weight="700" fill="#64748B">yes</text>
  <line x1="300" y1="316" x2="300" y2="344" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 1 ================= -->
  <rect x="100" y="348" width="400" height="124" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="374" r="17" fill="#B45309"/>
  <text x="100" y="380" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="126" y="380" font-size="17" font-weight="700" fill="#0F172A">Set the appetite</text>
  <text x="126" y="404" font-size="13" fill="#475569">• Small batch, or big batch = the whole cycle</text>
  <text x="126" y="424" font-size="13" fill="#475569">• Decide the time before you know the solution</text>
  <text x="126" y="444" font-size="13" fill="#475569">• Fixed time, variable scope. Not an estimate.</text>
  <text x="126" y="464" font-size="12.5" font-style="italic" fill="#B45309">→ a number you can defend (see guide §3)</text>

  <line x1="300" y1="472" x2="300" y2="500" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 2 ================= -->
  <rect x="100" y="504" width="400" height="132" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="530" r="17" fill="#B45309"/>
  <text x="100" y="536" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="126" y="536" font-size="17" font-weight="700" fill="#0F172A">Narrow the problem</text>
  <text x="126" y="560" font-size="13" fill="#475569">• “What happened right before you asked?”</text>
  <text x="126" y="580" font-size="13" fill="#475569">• Every solution request hides a stuck person</text>
  <text x="126" y="600" font-size="13" fill="#475569">• Name the actor, the moment, how often</text>
  <text x="126" y="626" font-size="12.5" font-style="italic" fill="#B45309">→ one paragraph + what is out of bounds</text>

  <line x1="300" y1="636" x2="300" y2="664" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 3 ================= -->
  <rect x="100" y="668" width="400" height="144" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="694" r="17" fill="#B45309"/>
  <text x="100" y="700" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="126" y="700" font-size="17" font-weight="700" fill="#0F172A">Find the elements</text>
  <text x="126" y="724" font-size="13" fill="#475569">• Breadboard: PLACES, affordances, connections</text>
  <text x="126" y="744" font-size="13" fill="#475569">• Words first — no pixels, no wireframes</text>
  <text x="126" y="764" font-size="13" fill="#475569">• Fat marker sketch only if layout is the point</text>
  <text x="126" y="784" font-size="13" fill="#475569">• Debating wording? You have dropped too low.</text>
  <text x="126" y="804" font-size="12.5" font-style="italic" fill="#B45309">→ 1–3 breadboards of the main use case</text>

  <line x1="300" y1="812" x2="300" y2="840" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 4 ================= -->
  <rect x="100" y="844" width="400" height="152" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="870" r="17" fill="#B45309"/>
  <text x="100" y="876" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="126" y="876" font-size="17" font-weight="700" fill="#0F172A">Risks &amp; rabbit holes</text>
  <text x="126" y="900" font-size="13" fill="#475569">• Walk the story in slow motion: “then what?”</text>
  <text x="126" y="920" font-size="13" fill="#475569">• Hunt unknowns, undesigned steps, dependencies</text>
  <text x="126" y="940" font-size="13" fill="#475569">• 15-min consult, one specific question</text>
  <text x="126" y="960" font-size="13" fill="#475569">• Banned: “the team will figure it out”</text>
  <text x="126" y="986" font-size="12.5" font-style="italic" fill="#B45309">→ every hole cut, patched, or made a no-go</text>

  <line x1="300" y1="996" x2="300" y2="1024" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 2 -->
  <polygon points="300,1028 460,1076 300,1124 140,1076" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="300" y="1071" font-size="13.5" font-weight="600" fill="#7C2D12" text-anchor="middle">Any hole still open —</text>
  <text x="300" y="1090" font-size="13.5" font-weight="600" fill="#7C2D12" text-anchor="middle">or does it bust the appetite?</text>

  <line x1="460" y1="1076" x2="552" y2="1076" stroke="#B45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="474" y="1066" font-size="12" font-weight="700" fill="#B45309">yes</text>
  <rect x="560" y="1042" width="380" height="68" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
  <text x="580" y="1070" font-size="13.5" font-weight="600" fill="#7C2D12">Cut scope · patch the shape ·</text>
  <text x="580" y="1092" font-size="13.5" font-weight="600" fill="#7C2D12">declare a no-go</text>

  <!-- loop back to stage 3 -->
  <path d="M 750 1042 L 750 740 L 508 740" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
  <text x="762" y="900" font-size="12.5" font-weight="600" fill="#B45309">re-shape,</text>
  <text x="762" y="918" font-size="12.5" font-weight="600" fill="#B45309">then walk it again</text>

  <text x="312" y="1146" font-size="12" font-weight="700" fill="#64748B">no</text>
  <line x1="300" y1="1124" x2="300" y2="1152" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 5 ================= -->
  <rect x="100" y="1156" width="400" height="152" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="1182" r="17" fill="#B45309"/>
  <text x="100" y="1188" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="126" y="1188" font-size="17" font-weight="700" fill="#0F172A">Write the pitch</text>
  <text x="126" y="1212" font-size="13" fill="#475569">1 Problem   2 Appetite   3 Solution</text>
  <text x="126" y="1232" font-size="13" fill="#475569">4 Rabbit holes   5 No-gos</text>
  <text x="126" y="1254" font-size="13" fill="#475569">• Posted to be read before any meeting</text>
  <text x="126" y="1274" font-size="13" fill="#475569">• Present, don't sell. Selling = not shaped.</text>
  <text x="126" y="1298" font-size="12.5" font-style="italic" fill="#B45309">→ a page someone can act on cold</text>

  <line x1="300" y1="1308" x2="300" y2="1336" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End -->
  <rect x="100" y="1340" width="400" height="70" rx="35" fill="#0F172A"/>
  <text x="300" y="1370" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Shaped pitch → the betting table</text>
  <text x="300" y="1391" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Part 2. Nothing is promised until it is bet on.</text>

  <!-- Side panel: keep in mind -->
  <rect x="560" y="380" width="380" height="262" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="584" y="414" font-size="15" font-weight="700" fill="#0F172A">Keep in mind at every stage</text>
  <text x="584" y="448" font-size="13" fill="#475569">▪ Rough, but solved. Both at once.</text>
  <text x="584" y="480" font-size="13" fill="#475569">▪ Fixed time, variable scope.</text>
  <text x="584" y="512" font-size="13" fill="#475569">▪ One or two shapers, behind a closed door.</text>
  <text x="584" y="544" font-size="13" fill="#475569">▪ Concrete enough to act on, abstract</text>
  <text x="598" y="562" font-size="13" fill="#475569">enough to leave the team room.</text>
  <text x="584" y="594" font-size="13" fill="#475569">▪ You are deciding what it is worth —</text>
  <text x="598" y="612" font-size="13" fill="#475569">not predicting how long it takes.</text>

  <!-- Footer -->
  <rect x="100" y="1450" width="840" height="86" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="124" y="1480" font-size="13" fill="#475569">Shaping runs in parallel with the current cycle, never inside it. Expect two or three sessions</text>
  <text x="124" y="1502" font-size="13" fill="#475569">across a few days — the loop from stage 4 back to stage 3 is normal, not a failure. Appetite sizes depend</text>
  <text x="124" y="1524" font-size="13" fill="#475569">on our cycle length (4 or 6 weeks) — see §3. Stage numbers match sections 2–7 of the guide.</text>

</svg>
